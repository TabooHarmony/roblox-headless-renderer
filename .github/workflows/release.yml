name: release

# Publishes to PyPI when a version tag (v1.0.0, v1.0.0rc1, ...) is pushed. Uses PyPI
# trusted publishing: no token is stored anywhere. One-time setup on pypi.org
# (Account > Publishing > add a pending publisher): project roblox-headless-renderer,
# owner TabooHarmony, repository roblox-headless-renderer, workflow release.yml,
# environment pypi. And in this repository's settings: an environment named `pypi`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: The tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      - name: Check the distributions
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
