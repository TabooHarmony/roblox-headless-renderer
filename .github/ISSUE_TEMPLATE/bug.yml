name: Something looks wrong
description: A render, layout number or check that does not match Roblox, or a command that fails.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a visual difference, a screenshot from Studio next to RHR's output helps most.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: shell
      placeholder: rhr render my_ui.rbxm --out ui.png
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rhr doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: A file that shows it
      description: >
        Attach the smallest .rbxm/.rbxmx that reproduces it (zip it if GitHub refuses
        the extension). Only share files you made or have the right to share.
