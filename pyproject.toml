[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-headless-renderer"
version = "0.7.0"
description = "Headless previews of Roblox UI and 3D builds for AI agents: PNGs plus layout JSON, no Studio needed."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["roblox", "rbxm", "rbxl", "rojo", "ui", "preview", "headless", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# Exact pins where pixels depend on them: skia-python draws the 2D UI. (The headless
# browser's version is pinned in rhr/browsers.py.)
dependencies = [
    "Pillow>=12,<13",
    "numpy>=2,<3",
    "requests>=2.31,<3",
    "skia-python==144.0.post2",
    # Reads zstd-compressed chunks of binary place files (rhr.rbxl_raw).
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
rhr = "rhr.client:main"
# The same command under the package's name, so `uvx roblox-headless-renderer ...` runs it.
roblox-headless-renderer = "rhr.client:main"

[project.urls]
Homepage = "https://github.com/TabooHarmony/roblox-headless-renderer"
Documentation = "https://github.com/TabooHarmony/roblox-headless-renderer/blob/main/docs/AGENTS.md"
Changelog = "https://github.com/TabooHarmony/roblox-headless-renderer/blob/main/CHANGELOG.md"
Issues = "https://github.com/TabooHarmony/roblox-headless-renderer/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["rhr", "rhr.rbx", "rhr.ui_engine"]
include-package-data = false

[tool.setuptools.package-data]
# Only what rendering needs from the vendored trees, plus their licences.
rhr = [
    "skill/SKILL.md",
    "luau/*.luau",
    "fonts/*",
    "scene/*",
    "scene/materials/*",
    "particles/*",
    "vendor/*.md",
    "vendor/three/*",
    "vendor/three/lights/*",
    "vendor/draco/*",
    "vendor/licenses/*",
]
"rhr.rbx" = ["reflection.json.gz"]
"rhr.ui_engine" = ["LICENSE", "THIRD_PARTY_NOTICES.md", "data/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
